databases:
  - name: saludpublica-db
    plan: free
    databaseName: saludpublica
    user: saludpublica

services:
  - type: web
    name: saludpublica-connect
    runtime: docker
    repo: https://github.com/MglSarmientox/-Actividad-proyecto-final-Sanare-Sistema-de-Salud
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/specialties
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saludpublica-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_USER
        value: ""
      - key: EMAIL_PASS
        value: ""